name: Notify blog

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # The blog pins this repository as a submodule; the event makes it move the pin and redeploy.
      # The default token cannot reach another repository, so this needs a token scoped to the blog only.
      - name: Ask the blog to pick up this commit
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BLOG_DISPATCH_TOKEN is not set, so the blog was not notified"
            exit 0
          fi
          gh api repos/yoonkiwoong/yoonkiwoong.github.io/dispatches \
            -f event_type=plex-paper-updated \
            -f "client_payload[sha]=${GITHUB_SHA}"
